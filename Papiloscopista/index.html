<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Material de estudo para Papiloscopista PCPR 2026, banca FGV." />
  <title>Papiloscopista PCPR FGV</title>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css"
    onerror="this.onerror=null;this.href='https://unpkg.com/docsify@4/lib/themes/vue.css'"
  />
  <style>
    :root {
      --bg: #f4f6f3;
      --surface: #ffffff;
      --surface-soft: #edf2ee;
      --ink: #26302d;
      --muted: #61706a;
      --line: #d7e0da;
      --accent: #0b6b57;
      --accent-soft: #dcebe6;
      --warn: #ad5d33;
      --danger: #a94442;
      --ok: #18735a;
      --sidebar: 310px;
      --content-max: 1120px;
      --pad: 34px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      letter-spacing: 0;
    }

    body {
      overflow-x: hidden;
    }

    #app {
      min-height: 100vh;
      background: var(--bg);
    }

    .sidebar {
      position: fixed !important;
      inset: 0 auto 0 0;
      z-index: 20;
      width: var(--sidebar) !important;
      padding: 58px 18px 28px;
      overflow-y: auto;
      background: var(--surface-soft) !important;
      border-right: 1px solid var(--line);
      transition: transform 180ms ease;
    }

    .sidebar .app-name {
      margin: 0 0 18px;
      padding: 0 8px;
      color: var(--ink);
      font-size: 1.05rem;
      font-weight: 780;
      line-height: 1.25;
      text-align: left;
    }

    .sidebar-nav li a {
      display: block;
      min-height: 34px;
      margin: 2px 0;
      padding: 7px 10px;
      border-radius: 8px;
      color: #2f3a36;
      font-size: 0.94rem;
      line-height: 1.35;
      text-decoration: none;
      white-space: normal;
    }

    .sidebar-nav li.active > a,
    .sidebar-nav li a:hover {
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 700;
    }

    .sidebar-nav > ul > li > p,
    .sidebar-nav > ul > li > a {
      margin: 0 0 10px;
      padding: 0 8px;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .sidebar-toggle {
      position: fixed !important;
      top: 12px !important;
      left: 14px !important;
      z-index: 35 !important;
      width: 38px !important;
      min-width: 38px !important;
      height: 38px !important;
      min-height: 38px !important;
      padding: 9px !important;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 12px 28px rgba(30, 45, 40, 0.12);
    }

    .sidebar-toggle span {
      width: 18px !important;
      height: 2px !important;
      margin-bottom: 4px !important;
      background-color: var(--ink) !important;
    }

    .content {
      position: absolute !important;
      top: 0 !important;
      right: 0 !important;
      left: var(--sidebar) !important;
      min-height: 100vh;
      margin-left: 0 !important;
      padding: 0 !important;
      background: var(--bg);
    }

    .markdown-section {
      max-width: var(--content-max) !important;
      margin: 0 auto !important;
      padding: 48px var(--pad) 88px !important;
      color: var(--ink);
      line-height: 1.66;
    }

    .markdown-section h1,
    .markdown-section h2,
    .markdown-section h3 {
      color: var(--ink);
      font-weight: 780;
      letter-spacing: 0;
      line-height: 1.24;
    }

    .markdown-section h1 {
      margin: 0 0 1.2rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--line);
      font-size: clamp(2rem, 2.6vw, 2.8rem);
    }

    .markdown-section h2 {
      margin-top: 2.05rem;
      font-size: 1.48rem;
    }

    .markdown-section h3 {
      margin-top: 1.45rem;
      font-size: 1.18rem;
    }

    .markdown-section p,
    .markdown-section li,
    .markdown-section td,
    .markdown-section th {
      font-size: 1.03rem;
    }

    .markdown-section a {
      color: var(--accent);
      font-weight: 650;
      text-underline-offset: 3px;
    }

    .markdown-section blockquote {
      margin: 1rem 0;
      padding: 0.85rem 1rem;
      border-left: 4px solid var(--accent);
      border-radius: 0 8px 8px 0;
      background: var(--accent-soft);
      color: #2c3a35;
    }

    .markdown-section code {
      border-radius: 6px;
      background: #e8eee9;
      color: #26302d;
      font-size: 0.92em;
    }

    .markdown-section table {
      display: table;
      width: 100%;
      margin: 1rem 0 1.25rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      border-collapse: collapse;
      overflow: hidden;
    }

    .markdown-section th {
      background: #e7eee9;
      color: #23312c;
      font-weight: 760;
      white-space: nowrap;
    }

    .markdown-section th,
    .markdown-section td {
      min-width: 0;
      padding: 0.66rem 0.72rem;
      border-color: var(--line);
      vertical-align: top;
      overflow-wrap: break-word;
    }

    .markdown-section tr:nth-child(even) td {
      background: #f8faf7;
    }

    .quiz-card {
      margin: 1.35rem 0;
      padding: 1rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: 0 10px 26px rgba(30, 45, 40, 0.06);
    }

    .quiz-source {
      margin-top: 0 !important;
      color: var(--muted);
      font-size: 0.92rem !important;
      font-weight: 700;
    }

    .quiz-options {
      display: grid;
      gap: 0.55rem;
      margin: 0.9rem 0;
    }

    .quiz-option {
      display: flex;
      gap: 0.62rem;
      align-items: flex-start;
      min-height: 44px;
      padding: 0.72rem 0.78rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f3f6f3;
      color: var(--ink);
      cursor: pointer;
      line-height: 1.45;
      transition: border-color 140ms ease, background 140ms ease;
    }

    .quiz-option:hover,
    .quiz-option.is-selected {
      border-color: #7ab5a2;
      background: var(--accent-soft);
    }

    .quiz-option.is-locked {
      cursor: default;
    }

    .quiz-option.is-correct {
      border-color: var(--ok);
      background: #dff1eb;
    }

    .quiz-option.is-wrong {
      border-color: var(--danger);
      background: #f5e3e1;
    }

    .quiz-option input {
      flex: 0 0 auto;
      margin-top: 0.25rem;
      accent-color: var(--accent);
    }

    .quiz-check,
    .quiz-reset {
      min-height: 40px;
      padding: 0.62rem 0.9rem;
      border: 1px solid var(--accent);
      border-radius: 8px;
      background: var(--accent);
      color: #ffffff;
      font: inherit;
      font-weight: 760;
      cursor: pointer;
    }

    .quiz-check:hover,
    .quiz-reset:hover {
      background: #095846;
      border-color: #095846;
    }

    .quiz-check:disabled,
    .quiz-reset:disabled {
      border-color: #98a7a1;
      background: #98a7a1;
      cursor: default;
    }

    .quiz-feedback {
      margin-top: 0.9rem;
      padding: 0.85rem 0.95rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f3f6f3;
    }

    .quiz-feedback[hidden] {
      display: none !important;
    }

    .quiz-feedback.is-correct {
      border-color: var(--ok);
      background: #dff1eb;
    }

    .quiz-feedback.is-wrong {
      border-color: var(--danger);
      background: #f5e3e1;
    }

    .quiz-feedback.is-warning {
      border-color: var(--warn);
      background: #f6eadf;
    }

    .quiz-explain {
      display: grid;
      gap: 0.4rem;
      margin: 0.72rem 0 0 !important;
      padding-left: 1.05rem !important;
    }

    .quiz-summary {
      margin: 1.4rem 0 1.8rem;
      padding: 1rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--accent-soft);
    }

    .quiz-summary h2 {
      margin-top: 0 !important;
    }

    .quiz-summary-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.65rem;
      margin: 0.8rem 0;
    }

    .quiz-summary-stat {
      padding: 0.7rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
    }

    .quiz-summary-stat strong {
      display: block;
      color: var(--ink);
      font-size: 1.35rem;
      line-height: 1.1;
    }

    .quiz-summary-stat span {
      display: block;
      margin-top: 0.2rem;
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 700;
    }

    .quiz-progress {
      height: 10px;
      overflow: hidden;
      border-radius: 999px;
      background: #cfdad3;
    }

    .quiz-progress span {
      display: block;
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: var(--accent);
      transition: width 180ms ease;
    }

    .quiz-summary-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 0.9rem;
    }

    .quiz-reset {
      border-color: #9fb0a8;
      background: var(--surface);
      color: #33423d;
      font-size: 0.92rem;
    }

    .proof-progress-cell {
      color: var(--ink);
      font-weight: 750;
      text-align: right;
      white-space: nowrap;
    }

    .proof-progress-cell.is-empty {
      color: var(--muted);
      font-weight: 650;
    }

    .loading-msg,
    .fallback-msg {
      max-width: 760px;
      margin: 4rem auto;
      padding: 1.25rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--muted);
      text-align: center;
    }

    body.close .sidebar {
      transform: translateX(calc(-1 * var(--sidebar)));
    }

    body.close .content {
      left: 62px !important;
    }

    @media (max-width: 980px) {
      :root {
        --sidebar: clamp(260px, 82vw, 320px);
        --pad: 22px;
      }

      .content,
      body.close .content {
        left: 0 !important;
        width: 100% !important;
      }

      .sidebar {
        box-shadow: 18px 0 42px rgba(30, 45, 40, 0.18);
      }

      body.close .sidebar {
        transform: translateX(-100%);
      }
    }

    @media (max-width: 640px) {
      :root {
        --pad: 18px;
      }

      .markdown-section {
        padding-top: 62px !important;
      }

      .markdown-section h1 {
        font-size: 1.75rem;
      }

      .markdown-section table {
        display: block;
        overflow-x: auto;
      }

      .markdown-section th,
      .markdown-section td {
        min-width: 130px;
      }

      .quiz-summary-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body class="close">
  <div id="app">
    <div class="loading-msg">
      <p>Carregando material de Papiloscopista PCPR FGV...</p>
      <p>
        <a href="LEITURA_OFICIAL.md">Leitura oficial</a>
        ·
        <a href="MAPA_DE_QUESTOES.md">Mapa de questões</a>
      </p>
    </div>
  </div>

  <script src="provas-utils.js"></script>
  <script>
    function getCurrentRoute() {
      const hash = window.location.hash.replace(/^#\/?/, "").replace(/\.md$/, "");
      return hash || "LEITURA_OFICIAL";
    }

    function getQuizStorageKey(route) {
      return `papilo-quiz:${route || getCurrentRoute()}`;
    }

    function readJson(key) {
      try {
        return JSON.parse(localStorage.getItem(key) || "{}");
      } catch (error) {
        return {};
      }
    }

    function writeJson(key, value) {
      localStorage.setItem(key, JSON.stringify(value));
    }

    function getQuizCardKey(card, index) {
      const firstInput = card.querySelector("input[type='radio']");
      const source = card.querySelector(".quiz-source");
      return (firstInput && firstInput.name) || (source && source.textContent.trim()) || `card-${index + 1}`;
    }

    function updateQuizOptionSelection(card) {
      const checked = card.querySelector("input[type='radio']:checked");
      card.querySelectorAll(".quiz-option").forEach((option) => {
        const input = option.querySelector("input[type='radio']");
        option.classList.toggle("is-selected", !!input && !!checked && input.value === checked.value);
      });
    }

    function lockQuizCard(card, selected, settings) {
      const answer = card.dataset.answer;
      const isCorrect = selected === answer;
      const feedback = card.querySelector(".quiz-feedback");

      card.dataset.locked = "1";
      card.dataset.correct = isCorrect ? "1" : "0";

      card.querySelectorAll(".quiz-option").forEach((option) => {
        const input = option.querySelector("input[type='radio']");
        if (!input) return;
        input.disabled = true;
        option.classList.add("is-locked");
        option.classList.toggle("is-correct", input.value === answer);
        option.classList.toggle("is-wrong", input.value === selected && !isCorrect);
      });

      const button = card.querySelector(".quiz-check");
      if (button) button.disabled = true;
      if (feedback) {
        feedback.hidden = false;
        feedback.classList.remove("is-warning");
        feedback.classList.add(isCorrect ? "is-correct" : "is-wrong");
      }

      if (settings && settings.persist) {
        const progress = readJson(settings.storageKey);
        progress[settings.cardKey] = { selected, answer, correct: isCorrect ? "1" : "0" };
        writeJson(settings.storageKey, progress);
      }
    }

    function restoreQuizCard(card, saved) {
      if (!saved || !saved.selected) return;
      const input = card.querySelector(`input[type='radio'][value='${saved.selected}']`);
      if (input) input.checked = true;
      updateQuizOptionSelection(card);
      lockQuizCard(card, saved.selected, { persist: false });
    }

    function resetQuizProgress(section) {
      localStorage.removeItem(getQuizStorageKey());
      section.querySelectorAll(".quiz-card").forEach((card) => {
        card.dataset.locked = "0";
        card.dataset.correct = "0";
        card.querySelectorAll(".quiz-option").forEach((option) => {
          option.classList.remove("is-selected", "is-locked", "is-correct", "is-wrong");
          const input = option.querySelector("input[type='radio']");
          if (input) {
            input.disabled = false;
            input.checked = false;
          }
        });
        const button = card.querySelector(".quiz-check");
        if (button) button.disabled = false;
        const feedback = card.querySelector(".quiz-feedback");
        if (feedback) {
          feedback.hidden = true;
          feedback.classList.remove("is-correct", "is-wrong", "is-warning");
          feedback.innerHTML = feedback.dataset.originalHtml || feedback.innerHTML;
        }
      });
      updateQuizSummary();
      hydrateProofProgressTable();
    }

    function updateQuizSummary() {
      const section = document.querySelector(".markdown-section");
      if (!section) return;
      const summary = section.querySelector(".quiz-summary");
      const cards = Array.from(section.querySelectorAll(".quiz-card"));
      if (!summary || !cards.length) return;

      const progress = {};
      cards.forEach((card, index) => {
        if (card.dataset.locked !== "1") return;
        progress[getQuizCardKey(card, index)] = {
          selected: "x",
          correct: card.dataset.correct
        };
      });

      const stats = window.PapiloQuizTools.getQuizProgressStats(progress, cards.length);
      const accuracy = stats.accuracy === null ? 0 : stats.accuracy;
      const note = stats.answered === stats.total
        ? `Tema concluído: ${stats.correct}/${stats.total} acertos (${accuracy}%).`
        : `Resolvidas ${stats.answered} de ${stats.total}. A alternativa trava depois de checar.`;

      summary.innerHTML = `
        <h2>Desempenho do tema</h2>
        <div class="quiz-summary-grid">
          <div class="quiz-summary-stat"><strong>${stats.answered}/${stats.total}</strong><span>respondidas</span></div>
          <div class="quiz-summary-stat"><strong>${stats.correct}</strong><span>acertos</span></div>
          <div class="quiz-summary-stat"><strong>${stats.wrong}</strong><span>erros</span></div>
          <div class="quiz-summary-stat"><strong>${accuracy}%</strong><span>aproveitamento</span></div>
        </div>
        <div class="quiz-progress" aria-label="Progresso do tema"><span style="width: ${stats.completion}%"></span></div>
        <p>${note}</p>
        <div class="quiz-summary-actions">
          <button class="quiz-reset" type="button" ${stats.answered ? "" : "disabled"}>Limpar respostas deste tema</button>
        </div>
      `;

      const resetButton = summary.querySelector(".quiz-reset");
      if (resetButton) resetButton.addEventListener("click", () => resetQuizProgress(section));
    }

    function ensureQuizSummary(section, cards) {
      if (section.querySelector(".quiz-summary")) {
        updateQuizSummary();
        return;
      }
      const summary = document.createElement("section");
      summary.className = "quiz-summary";
      summary.setAttribute("aria-live", "polite");
      cards[cards.length - 1].insertAdjacentElement("afterend", summary);
      updateQuizSummary();
    }

    function initQuizzes() {
      const section = document.querySelector(".markdown-section");
      const cards = Array.from(document.querySelectorAll(".quiz-card"));
      if (!section || !cards.length) return;

      const storageKey = getQuizStorageKey();
      const savedProgress = readJson(storageKey);
      ensureQuizSummary(section, cards);

      cards.forEach((card, index) => {
        if (card.dataset.quizReady === "1") return;
        const answer = card.dataset.answer;
        const button = card.querySelector(".quiz-check");
        const feedback = card.querySelector(".quiz-feedback");
        const options = Array.from(card.querySelectorAll(".quiz-option"));
        const cardKey = getQuizCardKey(card, index);
        if (!answer || !button || !feedback || !options.length) return;
        feedback.dataset.originalHtml = feedback.innerHTML;

        options.forEach((option) => {
          const input = option.querySelector("input[type='radio']");
          if (!input) return;
          input.addEventListener("change", () => {
            if (feedback.classList.contains("is-warning")) {
              feedback.hidden = true;
              feedback.className = "quiz-feedback";
              feedback.innerHTML = feedback.dataset.originalHtml || feedback.innerHTML;
            }
            updateQuizOptionSelection(card);
          });
        });

        button.addEventListener("click", () => {
          if (card.dataset.locked === "1") return;
          const checked = card.querySelector("input[type='radio']:checked");
          feedback.hidden = false;
          feedback.className = "quiz-feedback";
          if (!checked) {
            feedback.classList.add("is-warning");
            feedback.innerHTML = "<p><strong>Escolha uma alternativa primeiro.</strong></p>";
            return;
          }
          feedback.innerHTML = feedback.dataset.originalHtml || feedback.innerHTML;
          lockQuizCard(card, checked.value, { persist: true, storageKey, cardKey });
          updateQuizSummary();
          hydrateProofProgressTable();
        });

        restoreQuizCard(card, savedProgress[cardKey]);
        card.dataset.quizReady = "1";
      });

      updateQuizSummary();
    }

    function getRouteFromLink(link) {
      const href = link.getAttribute("href") || "";
      return href.replace(/^\.\//, "").replace(/\.md(#.*)?$/, "").replace(/#.*$/, "");
    }

    function hydrateProofProgressTable() {
      const section = document.querySelector(".markdown-section");
      if (!section) return;
      const table = Array.from(section.querySelectorAll("table")).find((candidate) => {
        const headers = Array.from(candidate.querySelectorAll("th")).map((cell) => cell.textContent.trim().toLowerCase());
        return headers.includes("tema") && headers.includes("total") && headers.includes("abrir");
      });
      if (!table) return;

      const headerRow = table.querySelector("thead tr") || table.querySelector("tr");
      if (!headerRow) return;
      let headers = Array.from(headerRow.children);
      const openIndex = headers.findIndex((cell) => cell.textContent.trim().toLowerCase() === "abrir");
      if (openIndex < 0) return;

      if (!headers.some((cell) => cell.textContent.trim().toLowerCase() === "respondidas")) {
        const answeredHeader = document.createElement("th");
        answeredHeader.textContent = "Respondidas";
        const accuracyHeader = document.createElement("th");
        accuracyHeader.textContent = "Acerto";
        headerRow.insertBefore(answeredHeader, headers[openIndex]);
        headerRow.insertBefore(accuracyHeader, headers[openIndex]);
      }

      headers = Array.from(headerRow.children);
      const totalIndex = headers.findIndex((cell) => cell.textContent.trim().toLowerCase() === "total");
      const rows = Array.from(table.querySelectorAll("tbody tr"));
      rows.forEach((row) => {
        const link = row.querySelector('a[href*="provas/"]');
        if (!link) return;
        const cells = Array.from(row.children);
        const total = Number.parseInt((cells[totalIndex] && cells[totalIndex].textContent || "").replace(/\D+/g, ""), 10) || 0;
        if (!row.querySelector(".proof-progress-answered")) {
          const openCell = cells.find((cell) => cell.contains(link)) || row.lastElementChild;
          const answeredCell = document.createElement("td");
          answeredCell.className = "proof-progress-cell proof-progress-answered";
          const accuracyCell = document.createElement("td");
          accuracyCell.className = "proof-progress-cell proof-progress-accuracy";
          row.insertBefore(answeredCell, openCell);
          row.insertBefore(accuracyCell, openCell);
        }
        const stats = window.PapiloQuizTools.getQuizProgressStats(readJson(getQuizStorageKey(getRouteFromLink(link))), total);
        const answeredCell = row.querySelector(".proof-progress-answered");
        const accuracyCell = row.querySelector(".proof-progress-accuracy");
        answeredCell.textContent = `${stats.answered}/${stats.total}`;
        accuracyCell.textContent = stats.accuracy === null ? "-" : `${stats.accuracy}%`;
        answeredCell.classList.toggle("is-empty", stats.answered === 0);
        accuracyCell.classList.toggle("is-empty", stats.accuracy === null);
      });
    }

    function tuneExternalLinks() {
      document.querySelectorAll('.markdown-section a[href^="http"]').forEach((link) => {
        link.setAttribute("target", "_blank");
        link.setAttribute("rel", "noopener noreferrer");
      });
    }

    function afterRender() {
      tuneExternalLinks();
      hydrateProofProgressTable();
      initQuizzes();
    }

    document.body.classList.toggle("close", window.innerWidth <= 980);

    window.$docsify = {
      name: "Papiloscopista PCPR FGV",
      homepage: "LEITURA_OFICIAL.md",
      loadSidebar: "_sidebar.md",
      loadNavbar: false,
      auto2top: true,
      executeScript: true,
      maxLevel: 4,
      subMaxLevel: 0,
      relativePath: false,
      routerMode: "hash",
      alias: {
        "/.*/_sidebar.md": "/_sidebar.md"
      },
      markdown: {
        smartypants: false
      },
      plugins: [
        function(hook) {
          hook.ready(afterRender);
          hook.doneEach(afterRender);
        }
      ]
    };

    function loadScript(src, fallback) {
      return new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = src;
        script.onload = resolve;
        script.onerror = () => {
          if (!fallback) {
            reject(new Error(`Falha ao carregar ${src}`));
            return;
          }
          const fallbackScript = document.createElement("script");
          fallbackScript.src = fallback;
          fallbackScript.onload = resolve;
          fallbackScript.onerror = reject;
          document.head.appendChild(fallbackScript);
        };
        document.head.appendChild(script);
      });
    }

    loadScript(
      "https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js",
      "https://unpkg.com/docsify@4/lib/docsify.min.js"
    );

    window.setTimeout(() => {
      const app = document.getElementById("app");
      if (!app || document.querySelector(".markdown-section")) return;
      app.innerHTML = `
        <div class="fallback-msg">
          <p>O leitor está demorando para carregar.</p>
          <p><a href="LEITURA_OFICIAL.md">Abrir leitura oficial em Markdown</a></p>
          <p><a href="MAPA_DE_QUESTOES.md">Abrir mapa de questões em Markdown</a></p>
          <p><a href="javascript:location.reload()">Recarregar</a></p>
        </div>
      `;
    }, 12000);
  </script>
</body>
</html>
